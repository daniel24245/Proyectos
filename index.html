<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-hearts">
        
        <span class="dev-title">HAPPY BIRTHDAY</span> 
        
        <div class="Happy_Birthday">
            <div class="card-content">
                <p class="dedication">Para el amor de mi vida: ❤️</p>
                
                <!-- Ilustración del árbol -->
                <div class="tree-container">
                    <img src="heart-tree.png" alt="Árbol de corazones" class="heart-tree">
                </div>

                <div class="countdown-container">
                    <p class="countdown-title">Esperando tu cumple en...</p>
                    <div class="timer">
                        <span id="days">0</span> días 
                        <span id="hours">00</span> horas 
                        <span id="minutes">00</span> min 
                        <span id="seconds">00</span> seg
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- Reproductor de música de fondo oculto -->
<audio id="musica-fondo" loop>
    <source src="Moments Together by TimTaj.mp3.mp4" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
</audio>
</body>
</html>
